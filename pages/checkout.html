<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout - Plantify</title>

    <link rel="stylesheet" href="../style.css">

    <style>
        .checkout-page {
            max-width: 650px;
            margin: auto;
            padding: 60px 20px;
        }

        .checkout-box {
            background: #f8f4e9;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .checkout-page h1 {
            text-align: center;
            color: #31543b;
            margin-bottom: 10px;
        }

        .checkout-page > p {
            text-align: center;
            color: #66705f;
            margin-bottom: 30px;
        }

        .checkout-box label {
            display: block;
            margin-bottom: 8px;
            color: #31543b;
            font-weight: bold;
        }

        .checkout-box textarea,
        .checkout-box select {
            width: 100%;
            padding: 14px;
            margin-bottom: 22px;
            border: 1px solid #ccd4c5;
            border-radius: 8px;
            box-sizing: border-box;
            background: white;
            font-family: inherit;
        }

        .checkout-box textarea {
            height: 120px;
            resize: vertical;
        }

        .checkout-box button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #31543b;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .checkout-box button:hover {
            background: #263f2d;
        }

        @media (max-width: 600px) {

            .checkout-box {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <header>
        <nav>
            <h2>Plantify</h2>

            <a href="../index.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="cart.html">Cart</a>
        </nav>
    </header>


    <main class="checkout-page">

        <h1>Checkout</h1>

        <p>Complete your order details.</p>

        <div class="checkout-box">

            <form onsubmit="placeOrder(event)">

                <label for="address">
                    Delivery Address
                </label>

                <textarea
                    id="address"
                    placeholder="Enter your full delivery address"
                ></textarea>


                <label for="payment">
                    Payment Method
                </label>

                <select id="payment">

                    <option value="">
                        Select Payment Method
                    </option>

                    <option value="Cash on Delivery">
                        Cash on Delivery
                    </option>

                    <option value="UPI">
                        UPI
                    </option>

                    <option value="Card">
                        Debit / Credit Card
                    </option>

                </select>


                <button type="submit">
                    Place Order
                </button>

            </form>

        </div>

    </main>


    <script src="../script.js"></script>

</body>
</html>
