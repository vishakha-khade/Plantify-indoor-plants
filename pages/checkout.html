<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Checkout - Plantify</title>

    <link rel="stylesheet" href="../style.css" />

    <style>
      .checkout-page {
        max-width: 650px;
        margin: auto;
        padding: 60px 20px;
      }

      .checkout-box {
        background: #f8f4e9;
        padding: 40px;
        border-radius: 18px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }

      .checkout-page h1 {
        text-align: center;
        color: #31543b;
        margin-bottom: 10px;
      }

      .checkout-page > p {
        text-align: center;
        color: #66705f;
        margin-bottom: 30px;
      }

      .checkout-box label {
        display: block;
        margin-bottom: 8px;
        color: #31543b;
        font-weight: bold;
      }

      .checkout-box textarea,
      .checkout-box select {
        width: 100%;
        padding: 14px;
        margin-bottom: 22px;
        border: 1px solid #ccd4c5;
        border-radius: 8px;
        box-sizing: border-box;
        background: white;
        font-family: inherit;
      }

      .checkout-box textarea {
        height: 120px;
        resize: vertical;
      }

      .checkout-box button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 8px;
        background: #31543b;
        color: white;
        font-size: 16px;
        cursor: pointer;
      }

      .checkout-box button:hover {
        background: #263f2d;
      }

      @media (max-width: 600px) {
        .checkout-box {
          padding: 25px;
        }
      }
      .navbar {
        position: relative;
        z-index: 1000;
      }

      .menu-button {
        position: relative;
        z-index: 1002;
      }

      .nav-links {
        z-index: 1001;
      }

      @media (max-width: 900px) {
        .nav-links {
          position: absolute;
          top: 100%;
          left: 0;
          right: 0;
          width: 100%;
          background: #f8f4e9;
          z-index: 1001;
          padding: 20px 0;
          box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
        }

        .nav-links.active {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 18px;
        }

        .nav-links li {
          width: 100%;
          text-align: center;
        }

        .nav-links a {
          display: block;
          padding: 8px;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <nav class="navbar">
        <a href="../index.html" class="logo"> plant<span>ify</span> </a>

        <button class="menu-button" onclick="toggleMenu()">
          <i class="fa-solid fa-bars"></i>
        </button>

        <ul class="nav-links" id="navLinks">
          <li><a href="../index.html">Home</a></li>
          <li><a href="shop.html">Shop</a></li>
          <li><a href="care.html">Plant Care</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>

        <a href="cart.html" class="nav-cart">
          <span>Cart</span>

          <b id="cartCount">0</b>
        </a>

        <div class="profile">
          <a
            href="account.html"
            class="profile-button"
            style="text-decoration: none"
          >
            <i class="fa-regular fa-circle-user"></i>
            <span id="profileName">Account</span>
          </a>

          <div class="profile-menu" id="profileMenu">
            <p id="profileUserName">Welcome</p>

            <a href="account.html"> My Account </a>

            <a href="login.html" id="profileLogin"> Login </a>

            <button id="profileLogout" onclick="logoutUser()">Logout</button>
          </div>
        </div>
      </nav>
    </header>
    <main class="checkout-page">
      <h1>Checkout</h1>

      <p>Complete your order details.</p>

      <div class="checkout-box">
        <form onsubmit="placeOrder(event)">
          <label for="address"> Delivery Address</label>

          <textarea
            id="address"
            placeholder="Enter your full delivery address"
          ></textarea>

          <label for="payment">Payment Method </label>

          <select id="payment">
            <option value="">Select Payment Method</option>

            <option value="Cash on Delivery">Cash on Delivery</option>

            <option value="UPI">UPI-Payment</option>

            <option value="Card">Debit / Credit Card</option>
          </select>

          <button type="submit">Place Order</button>
        </form>
      </div>
    </main>

    <script src="../script.js"></script>
  </body>
</html>
