<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Cart - Plantify</title>

    <link rel="stylesheet" href="../style.css">

    <style>
        .cart-page {
            max-width: 1000px;
            margin: auto;
            padding: 60px 20px;
        }

        .cart-page h1 {
            text-align: center;
            color: #31543b;
            margin-bottom: 40px;
        }
        h2{
            font-size: x-large;
            text-align: center;
        }

        #cartItems {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 25px;
            padding: 20px;
            background: #f8f4e9;
            border-radius: 15px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.06);
        }

        .cart-item img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 12px;
        }

        .cart-item-info h3 {
            color: #31543b;
            margin-bottom: 8px;
        }

        .cart-item-info p {
            color: #66705f;
        }

        .cart-item-info button {
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            background: #b85c5c;
            color: white;
            cursor: pointer;
        }

        .cart-summary {
            margin-top: 30px;
            padding: 25px;
            background: #31543b;
            color: white;
            border-radius: 15px;
            text-align: right;
        }

        .cart-summary button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #f8f4e9;
            color: #31543b;
            font-weight: bold;
            cursor: pointer;
        }
        button{
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @media (max-width: 600px) {

            .cart-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .cart-item img {
                width: 100%;
                height: 200px;
            }
        }
    </style>
</head>

<body>

    <header>
        <nav>
            <h2>Plantify</h2>

            <a href="../index.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="login.html">Login</a>
        </nav>
    </header>


    <main class="cart-page">

        <h1>My Cart</h1>

        <div id="cartItems"></div>

        <div class="cart-summary">

            <h2>
                Total: <span id="totalPrice">₹0</span>
            </h2>

            <button onclick="goToCheckout()">
                Proceed to Checkout
            </button>

        </div>

    </main>


    <script src="../script.js"></script>

</body>
</html>
