<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Plantify | Shop</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../style.css">

</head>

<body>

<header>

    <nav class="navbar">

        <a href="../index.html" class="logo">
            plant<span>ify</span>
        </a>

        <button class="menu-button" onclick="toggleMenu()">☰</button>

        <ul class="nav-links" id="navLinks">

            <li><a href="../index.html">Home</a></li>
            <li><a href="shop.html">Shop</a></li>
            <li><a href="care.html">Plant Care</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>

        </ul>

        <a href="shop.html" class="nav-cart">
            Bag <span id="cartCount">0</span>
        </a>

    </nav>

</header>


<section class="page-hero shop-hero">

    <div>
        <p class="eyebrow">THE COLLECTION</p>
        <h1>Shop plants.</h1>
    </div>

</section>


<main class="shop-page">

    <div class="shop-controls">

        <input
            type="text"
            id="searchInput"
            placeholder="Search plants..."
            oninput="searchPlants()"
        >

        <select id="categoryFilter" onchange="filterPlants()">

            <option value="All">All plants</option>
            <option value="Indoor">Indoor</option>
            <option value="Easy Care">Easy Care</option>
            <option value="Flowering">Flowering</option>
            <option value="Succulent">Succulent</option>

        </select>

        <select id="sortPlants" onchange="sortPlants()">

            <option value="default">Sort by</option>
            <option value="low">Price: Low to High</option>
            <option value="high">Price: High to Low</option>

        </select>

    </div>


    <div class="product-grid" id="productGrid"></div>

</main>

<footer>

    <div class="footer-brand">

        <a href="../index.html" class="logo">
            plant<span>ify</span>
        </a>
        <p>
            Making everyday spaces<br>
            a little greener.
        </p>
    </div>

    <div class="footer-links">

        <a href="shop.html">Shop</a>
        <a href="care.html">Plant Care</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>

    </div>

    <div>
        <p>© 2026 Plantify</p>
    </div>

</footer>


<script src="../script.js"></script>

</body>

</html>
